<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto Netle – 2K’ya Kadar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--card:#fff;--tx:#1c1b1a;--mut:#6b6862;--ac:#6d4aff;--bd:#e3e0da}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121114;--card:#1c1b20;--tx:#f1eff5;--mut:#9c98a6;--ac:#9b83ff;--bd:#2d2b34}}
:root[data-theme="dark"]{--bg:#121114;--card:#1c1b20;--tx:#f1eff5;--mut:#9c98a6;--ac:#9b83ff;--bd:#2d2b34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px}
#drop{border:2px dashed var(--bd);border-radius:14px;padding:36px 16px;text-align:center;cursor:pointer;color:var(--mut)}
#drop.over{border-color:var(--ac);color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row label{flex:1 1 200px;font-size:.9rem}
.row input[type=range],.row select{width:100%;margin-top:6px}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:1rem;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.cmp{position:relative;overflow:hidden;border-radius:12px;background:#000;touch-action:none;user-select:none}
.cmp canvas,.cmp img{display:block;width:100%;height:auto}
#afterWrap{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 0 0 50%)}
#afterWrap canvas{position:absolute;inset:0;width:100%;height:100%}
#bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;box-shadow:0 0 6px #0008;pointer-events:none}
.tag{position:absolute;top:8px;padding:2px 8px;background:#000a;color:#fff;font-size:.75rem;border-radius:6px}
#info{color:var(--mut);font-size:.85rem;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Foto Netle</h1>
<p class="sub">Fotoğrafını yükle, en fazla 2K (2048 px) çözünürlükte netleştirilmiş halini indir. Her şey tarayıcında işlenir, dosyan hiçbir yere gönderilmez.</p>

<div class="card">
  <div id="drop">Fotoğraf seçmek için dokun veya buraya sürükle</div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<div class="card" id="panel" hidden>
  <div class="row">
    <label>Hedef çözünürlük
      <select id="res"><option value="1280">HD (1280 px)</option><option value="1920">Full HD (1920 px)</option><option value="2048" selected>2K (2048 px)</option></select>
    </label>
    <label>Netlik: <span id="vS">0.6</span>
      <input type="range" id="sharp" min="0" max="1.5" step="0.1" value="0.6">
    </label>
    <label>Kontrast: <span id="vC">10</span>%
      <input type="range" id="con" min="0" max="30" step="1" value="10">
    </label>
  </div>
  <div class="btns">
    <button id="go">Netleştir</button>
    <button class="sec" id="dl" disabled>İndir (JPG)</button>
  </div>
  <div id="info"></div>
</div>

<div class="card" id="result" hidden>
  <div class="cmp" id="cmp">
    <canvas id="before"></canvas>
    <div id="afterWrap"><canvas id="after"></canvas></div>
    <div id="bar"></div>
    <span class="tag" style="left:8px">Önce</span>
    <span class="tag" style="right:8px">Sonra</span>
  </div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
let img=null,fileName='foto';
const drop=$('drop'),fileIn=$('file');
drop.onclick=()=>fileIn.click();
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>load(ev.dataTransfer.files[0]));
fileIn.onchange=()=>load(fileIn.files[0]);
$('sharp').oninput=e=>$('vS').textContent=e.target.value;
$('con').oninput=e=>$('vC').textContent=e.target.value;

function load(f){
  if(!f||!f.type.startsWith('image/'))return;
  fileName=f.name.replace(/\.[^.]+$/,'');
  const url=URL.createObjectURL(f);
  const im=new Image();
  im.onload=()=>{img=im;$('panel').hidden=false;$('info').textContent='Yüklendi: '+im.naturalWidth+' × '+im.naturalHeight+' px';drop.textContent='Başka bir fotoğraf seçmek için dokun';process();};
  im.src=url;
}
$('go').onclick=process;

function process(){
  if(!img)return;
  const btn=$('go');btn.disabled=true;btn.textContent='İşleniyor…';
  setTimeout(()=>{
    try{run()}catch(e){$('info').textContent='Hata: '+e.message}
    btn.disabled=false;btn.textContent='Netleştir';
  },30);
}

function run(){
  const maxSide=Math.min(+$('res').value,2048);
  const w0=img.naturalWidth,h0=img.naturalHeight;
  const k=maxSide/Math.max(w0,h0);
  const W=Math.round(w0*k),H=Math.round(h0*k);

  // Önce: orijinal (ekranda göstermek için hedef boyutta, basit ölçekleme)
  const b=$('before');b.width=W;b.height=H;
  const bc=b.getContext('2d');bc.imageSmoothingQuality='high';bc.drawImage(img,0,0,W,H);

  // Kademeli ölçekleme (her adım en fazla 1.5x) – daha yumuşak büyütme
  let cur=document.createElement('canvas');cur.width=w0;cur.height=h0;
  cur.getContext('2d').drawImage(img,0,0);
  while(cur.width!==W||cur.height!==H){
    const f=W/cur.width;
    const step=f>1?Math.min(1.5,f):Math.max(0.5,f);
    const nw=Math.abs(step-f)<1e-6?W:Math.round(cur.width*step);
    const nh=nw===W?H:Math.round(cur.height*step);
    const n=document.createElement('canvas');n.width=nw;n.height=nh;
    const c=n.getContext('2d');c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
    c.drawImage(cur,0,0,nw,nh);cur=n;
  }

  const a=$('after');a.width=W;a.height=H;
  const ac=a.getContext('2d');ac.drawImage(cur,0,0);
  let d=ac.getImageData(0,0,W,H);
  sharpen(d,+$('sharp').value);
  contrast(d,+$('con').value/100);
  ac.putImageData(d,0,0);

  $('result').hidden=false;
  $('dl').disabled=false;
  $('info').textContent='Sonuç: '+W+' × '+H+' px (kaynak: '+w0+' × '+h0+' px)';
}

function sharpen(d,amt){
  if(amt<=0)return;
  const {width:w,height:h,data:s}=d;
  const o=new Uint8ClampedArray(s);
  const c=amt*0.5;
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i=(y*w+x)*4;
      for(let ch=0;ch<3;ch++){
        const p=i+ch;
        const v=s[p]*(1+4*c)-c*(s[p-4]+s[p+4]+s[p-w*4]+s[p+w*4]);
        o[p]=v;
      }
    }
  }
  s.set(o);
}
function contrast(d,c){
  if(c<=0)return;
  const f=1+c,s=d.data;
  for(let i=0;i<s.length;i+=4){
    s[i]=(s[i]-128)*f+128;s[i+1]=(s[i+1]-128)*f+128;s[i+2]=(s[i+2]-128)*f+128;
  }
}

$('dl').onclick=()=>{
  $('after').toBlob(bl=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);
    a.download=fileName+'-netlestirilmis.jpg';document.body.appendChild(a);a.click();a.remove();
  },'image/jpeg',0.95);
};

// Önce/Sonra kaydırıcı
const cmp=$('cmp'),wrap=$('afterWrap'),bar=$('bar');
function setPos(clientX){
  const r=cmp.getBoundingClientRect();
  const p=Math.max(0,Math.min(100,(clientX-r.left)/r.width*100));
  wrap.style.clipPath='inset(0 0 0 '+p+'%)';bar.style.left=p+'%';
}
let drag=false;
cmp.addEventListener('pointerdown',e=>{drag=true;setPos(e.clientX)});
window.addEventListener('pointermove',e=>{if(drag)setPos(e.clientX)});
window.addEventListener('pointerup',()=>drag=false);
</script>
</body>
</html>
